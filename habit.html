<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 習慣トラッカー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: linear-gradient(160deg, #fce7f3 0%, #ede9fe 55%, #dbeafe 100%);
      min-height: 100vh;
      color: #4a4a6a;
      padding: 16px 16px 40px;
    }

    .container { max-width: 460px; margin: 0 auto; }

    /* ── Header ── */
    header { text-align: center; padding: 24px 0 20px; }
    header h1 { font-size: 26px; color: #7c3aed; letter-spacing: 0.04em; }
    .date-text { font-size: 13px; color: #a78bfa; margin-top: 4px; }

    /* ── Progress card ── */
    .progress-card {
      background: white;
      border-radius: 24px;
      padding: 22px 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.08);
      text-align: center;
    }
    .progress-label { font-size: 12px; color: #a78bfa; letter-spacing: 0.08em; margin-bottom: 14px; }

    .ring-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 12px;
    }
    .ring-svg { transform: rotate(-90deg); }
    .ring-bg   { fill: none; stroke: #f3e8ff; stroke-width: 11; }
    .ring-fill {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 11;
      stroke-linecap: round;
      stroke-dasharray: 339.29;
      stroke-dashoffset: 339.29;
      transition: stroke-dashoffset 0.55s cubic-bezier(0.4,0,0.2,1);
    }
    .ring-pct {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 700; color: #7c3aed;
      pointer-events: none;
    }
    .ring-sub { font-size: 13px; color: #a78bfa; }

    /* ── All-done banner ── */
    .all-done {
      display: none;
      background: linear-gradient(135deg, #c084fc, #f9a8d4);
      color: white;
      text-align: center;
      padding: 13px;
      border-radius: 16px;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(192,132,252,0.45);
      animation: slideDown 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Add form ── */
    .add-form { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-input {
      flex: 1;
      padding: 13px 16px;
      border: 2px solid #e9d5ff;
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: white;
      color: #4a4a6a;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-input:focus { border-color: #c084fc; box-shadow: 0 0 0 3px rgba(192,132,252,0.15); }
    .add-input::placeholder { color: #d8b4fe; }
    .add-input.shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
      80%      { transform: translateX(-3px); }
    }

    .add-btn {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #c084fc, #f9a8d4);
      border: none; border-radius: 14px;
      color: white; font-size: 26px; line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(192,132,252,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .add-btn:hover  { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(192,132,252,0.55); }
    .add-btn:active { transform: scale(0.93); }

    /* ── Habit cards ── */
    .habits-list { display: flex; flex-direction: column; gap: 10px; }

    .habit-card {
      background: white;
      border-radius: 18px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    }
    .habit-card.checked {
      background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 100%);
      box-shadow: 0 3px 12px rgba(192,132,252,0.12);
    }
    .habit-card:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(0,0,0,0.08); }
    .habit-card.pop { animation: pop 0.35s ease; }
    @keyframes pop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    /* check button */
    .check-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 50%;
      border: 2.5px solid #e9d5ff;
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .check-btn.checked {
      background: linear-gradient(135deg, #c084fc, #f9a8d4);
      border-color: transparent;
      box-shadow: 0 3px 12px rgba(192,132,252,0.45);
    }
    .check-icon {
      color: white;
      font-size: 17px;
      font-weight: 700;
      opacity: 0;
      transform: scale(0) rotate(-20deg);
      transition: opacity 0.25s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
    }
    .check-btn.checked .check-icon { opacity: 1; transform: scale(1) rotate(0); }

    .habit-info { flex: 1; min-width: 0; }
    .habit-name {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.25s;
    }
    .habit-card.checked .habit-name { color: #7c3aed; }
    .habit-streak { font-size: 11.5px; color: #b0a0c8; margin-top: 3px; }
    .streak-hot { color: #f97316; font-weight: 700; }

    .del-btn {
      background: none; border: none;
      color: #e0d6f5; font-size: 19px; line-height: 1;
      cursor: pointer; padding: 5px; border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .del-btn:hover { color: #f87171; background: #fff1f2; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 44px 20px; color: #d8b4fe;
    }
    .empty-icon { font-size: 52px; margin-bottom: 14px; }
    .empty-state p { font-size: 14px; line-height: 1.7; }

    /* ── Floating particles ── */
    .particle {
      position: fixed; pointer-events: none; z-index: 9999;
      font-size: 20px; user-select: none;
      animation: pfly 1.1s ease-out forwards;
    }
    @keyframes pfly {
      0%   { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0.4) rotate(var(--rot)); }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>🌸 習慣トラッカー</h1>
    <div class="date-text" id="dateText"></div>
  </header>

  <!-- Progress ring -->
  <div class="progress-card">
    <div class="progress-label">TODAY'S PROGRESS</div>
    <div class="ring-wrap">
      <svg class="ring-svg" width="130" height="130" viewBox="0 0 130 130">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#f9a8d4"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg"   cx="65" cy="65" r="54"/>
        <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="54"/>
      </svg>
      <div class="ring-pct" id="ringPct">0%</div>
    </div>
    <div class="ring-sub" id="ringSub">習慣を追加してみよう</div>
  </div>

  <!-- All done -->
  <div class="all-done" id="allDone">🎉 今日の習慣をすべて達成！やったね✨</div>

  <!-- Add form -->
  <div class="add-form">
    <input id="addInput" class="add-input" type="text" placeholder="新しい習慣を追加…" maxlength="30">
    <button class="add-btn" onclick="addHabit()">＋</button>
  </div>

  <!-- List -->
  <div class="habits-list" id="habitsList"></div>

</div>

<script>
  const KEY = 'habitTracker_v2';

  /* ── date helpers ── */
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function pad(n) { return String(n).padStart(2,'0'); }
  function prevDay(ds) {
    const d = new Date(ds); d.setDate(d.getDate()-1);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function fmtDate(ds) {
    const d = new Date(ds+'T00:00:00');
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
  }

  /* ── storage ── */
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {habits:[]}; }
    catch { return {habits:[]}; }
  }
  function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  /* ── streak ── */
  function streak(dates) {
    if (!dates || !dates.length) return 0;
    const set = new Set(dates);
    const t = today();
    let cur = set.has(t) ? t : prevDay(t);
    let n = 0;
    while (set.has(cur)) { n++; cur = prevDay(cur); }
    return n;
  }

  /* ── helpers ── */
  function checkedToday(habit) {
    return !!(habit.dates && habit.dates.includes(today()));
  }
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── particles ── */
  function burst(cx, cy) {
    const mx = ['✨','🌸','⭐','💫','🎀','🌷','💖','🌈'];
    for (let i=0; i<9; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = mx[i % mx.length];
      const a = (Math.PI*2*i/9) + (Math.random()-0.5)*0.7;
      const r = 70 + Math.random()*70;
      el.style.cssText = `left:${cx}px;top:${cy}px;`
        + `--tx:${Math.cos(a)*r}px;--ty:${Math.sin(a)*r - 30}px;`
        + `--rot:${Math.random()*400-200}deg`;
      document.body.appendChild(el);
      el.addEventListener('animationend', ()=>el.remove(), {once:true});
    }
  }

  /* ── toggle ── */
  function toggle(id, ev) {
    const data = load();
    const h = data.habits.find(x=>x.id===id);
    if (!h) return;
    if (!h.dates) h.dates = [];
    const t = today();
    const idx = h.dates.indexOf(t);
    if (idx === -1) {
      h.dates.push(t);
      const r = ev.currentTarget.getBoundingClientRect();
      burst(r.left + r.width/2, r.top + r.height/2);
      const card = document.getElementById('c-'+id);
      if (card) { card.classList.add('pop'); card.addEventListener('animationend',()=>card.classList.remove('pop'),{once:true}); }
    } else {
      h.dates.splice(idx,1);
    }
    save(data); render();
  }

  /* ── add ── */
  function addHabit() {
    const inp = document.getElementById('addInput');
    const name = inp.value.trim();
    if (!name) {
      inp.classList.add('shake');
      inp.addEventListener('animationend',()=>inp.classList.remove('shake'),{once:true});
      inp.focus(); return;
    }
    const data = load();
    data.habits.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2), name, dates:[] });
    save(data); inp.value=''; render();
  }

  /* ── delete ── */
  function del(id) {
    const data = load();
    data.habits = data.habits.filter(h=>h.id!==id);
    save(data); render();
  }

  /* ── render ── */
  function render() {
    const data = load();
    const habits = data.habits;
    const t = today();

    document.getElementById('dateText').textContent = fmtDate(t);

    /* progress */
    const total = habits.length;
    const done  = habits.filter(h=>checkedToday(h)).length;
    const pct   = total===0 ? 0 : Math.round(done/total*100);
    const circ  = 339.29;
    document.getElementById('ringFill').style.strokeDashoffset = circ - pct/100*circ;
    document.getElementById('ringPct').textContent  = pct+'%';
    document.getElementById('ringSub').textContent  = total===0 ? '習慣を追加してみよう' : `${done} / ${total} 達成`;

    /* all-done */
    const banner = document.getElementById('allDone');
    if (total>0 && done===total) {
      if (banner.style.display==='none') banner.style.display='block';
    } else {
      banner.style.display='none';
    }

    /* list */
    const list = document.getElementById('habitsList');
    if (habits.length===0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🌱</div><p>ここに習慣が表示されます<br>上の入力欄から追加しよう！</p></div>`;
      return;
    }
    list.innerHTML = habits.map(h=>{
      const on = checkedToday(h);
      const s  = streak(h.dates);
      const streakHtml = s>0
        ? `🔥 <span class="streak-hot">${s}</span>日連続`
        : `今日から始めよう！`;
      return `
        <div class="habit-card ${on?'checked':''}" id="c-${h.id}">
          <button class="check-btn ${on?'checked':''}" onclick="toggle('${h.id}',event)">
            <span class="check-icon">✓</span>
          </button>
          <div class="habit-info">
            <div class="habit-name">${esc(h.name)}</div>
            <div class="habit-streak">${streakHtml}</div>
          </div>
          <button class="del-btn" onclick="del('${h.id}')" title="削除">×</button>
        </div>`;
    }).join('');
  }

  /* ── Enter key ── */
  document.getElementById('addInput').addEventListener('keydown', e=>{
    if (e.key==='Enter') addHabit();
  });

  /* ── midnight auto-refresh ── */
  function scheduleRefresh() {
    const now  = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
    setTimeout(()=>{ render(); scheduleRefresh(); }, next-now);
  }

  render();
  scheduleRefresh();
</script>
</body>
</html>
